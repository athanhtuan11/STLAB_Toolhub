# Template "reel-9x16" (file: templates/reel-9x16/cau-hinh.yaml) – video dọc TikTok/Reels/Shorts cho STLab.
# build.py đọc file này; Claude đọc để biết giới hạn khi lập kế hoạch (plan.json).
id: reel-9x16
ten: Reel dọc 9:16 (TikTok / Reels / Shorts)

khung: {width: 1080, height: 1920, fps: 30}
thoi_luong_s: {toi_thieu: 15, muc_tieu: 45, toi_da: 60}

cat:
  bo_tu_dem: [ờ, ơ, à, ừ, ừm, ờm, ưm, ừa, thì là, kiểu như]
  khoang_lang_toi_da_s: 0.35      # im lặng giữa hai từ dài hơn mức này thì cắt bỏ
  dem_s: 0.08                     # giữ thêm trước/sau mỗi cụm lời để không cụt tiếng

khung_doc:
  # Clip khác tỉ lệ khung: auto_reframe (bám chủ thể, khung 9:16) + phóng motion để phủ kín khung.
  # Đã thử 2026-10-21: chỉ auto_reframe thì còn viền đen; chỉ phóng thì cắt giữa (mất chủ thể lệch tâm).
  effect: auto_reframe
  aspect: Vertical 9:16
  preset: Default                 # Slower Motion | Default | Faster Motion

phu_de:                           # kiểu TikTok: chữ trắng viền đen, không hộp nền
  bat: true
  ky_tu_toi_da: 22
  thoi_luong_toi_da_s: 2.2
  in_hoa: false
  font: Arial
  co_chu: 58                      # px trên khung cao 1920
  mau: "#FFFFFF"
  vien: 7
  mau_vien: "#000000"
  neo: bottom
  le_duoi: 0.2                    # 20% chiều cao từ đáy (tránh nút của TikTok/Reels)

chu_lon:                          # kiểu chữ mở đầu (hook) và CTA cuối – chữ tự tạo, không dùng template ngang 1920
  font: Arial
  font_style: Bold
  co_chu: 104
  mau: "#FFD400"                  # TODO: thay bằng màu thương hiệu STLab
  vien: 9
  mau_vien: "#000000"
  hop: [960, 520]                 # vùng chữ (px), tự xuống dòng
  vi_tri: [60, 300]               # góc trên trái của vùng chữ (khoảng 1/6 từ trên xuống)
mo_dau: {thoi_luong_s: 2.5}       # dòng chữ "hook" 2–3 giây đầu
cuoi: {thoi_luong_s: 2.5}         # lời kêu gọi (CTA)

am_thanh:
  loudness_lufs: -14              # chuẩn mạng xã hội
  nhac_nen: null                  # TODO: đường dẫn nhạc có bản quyền dùng được (thư viện STLab)
  giam_nhac_khi_noi: true

mau_sac:
  lut: null                       # TODO: LUT màu thương hiệu STLab (nếu có)

thuong_hieu:
  mau_chinh: null                 # TODO: mã màu STLab
  logo: null                      # TODO: file logo PNG nền trong

xuat:
  preset: "Social Vertical 1080×1920"
