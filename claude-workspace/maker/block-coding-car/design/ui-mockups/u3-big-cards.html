@font-face{font-family:'Be Vietnam Pro';font-weight:400;src:url('../../../../studio/toolhub/static/fonts/be-vietnam-pro-400-latin.woff2')}
@font-face{font-family:'Be Vietnam Pro';font-weight:400;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB;src:url('../../../../studio/toolhub/static/fonts/be-vietnam-pro-400-vietnamese.woff2')}

@font-face{font-family:'Be Vietnam Pro';font-weight:700;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB;src:url('../../../../studio/toolhub/static/fonts/be-vietnam-pro-700-vietnamese.woff2')}
:root{
 /* tokens STLab ban sang (studio/design/DESIGN.md) */
 --bg:#ECF1EF; --card:#FFFFFF; --ink:#16231D; --pine:#1E5A45; --pass:#257A45; --fail:#B3341F; --line:#C9D6D0;
 /* mau nhom khoi cho tre */
 --move:#2F7BE0; --ctrl:#F2B01E; --ctrl-ink:#3A2A00; --snd:#8E55D6; --end:#E0453A;
 --move-bg:rgba(47,123,224,.14); --ctrl-bg:rgba(242,176,30,.22); --snd-bg:rgba(142,85,214,.14); --end-bg:rgba(224,69,58,.14);
 --grid-a:#F6FAF8; --grid-b:#DCE9E3; --goal-bg:#FFF3C4; --glow:#FFD84D; --shadow:rgba(0,0,0,.25);
 --btn-h:72px; --r:20px;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;display:flex;flex-direction:column}
.top{height:96px;flex:none;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px}
.conn{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:48px;padding:6px 22px 6px 14px;height:68px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--pass);box-shadow:0 0 0 6px rgba(37,122,69,.25)}
.conn svg{width:56px;height:56px}
.conn b{font-size:22px}
.sp{flex:1}
.btn{height:var(--btn-h);min-width:var(--btn-h);border:0;border-radius:var(--r);padding:0 28px;font:700 24px 'Be Vietnam Pro';color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 var(--shadow)}
.btn svg{width:44px;height:44px}
.b-try{background:var(--move)} .b-real{background:var(--pine)}
.b-stop{background:var(--fail);height:84px;padding:0 40px;font-size:32px;border-radius:42px}
.b-stop svg{width:52px;height:52px}
.lv{display:flex;gap:8px;background:var(--bg);padding:6px;border-radius:26px}
.lv span{height:60px;min-width:60px;padding:0 22px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 26px 'Be Vietnam Pro';color:var(--pine)}
.lv .on{background:var(--pine);color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,var(--c));grid-template-rows:repeat(6,var(--c));border:6px solid var(--pine);border-radius:24px;overflow:hidden;background:var(--grid-a);position:relative;flex:none}
.grid i{display:flex;align-items:center;justify-content:center;background:var(--grid-a)}
.grid i.d{background:var(--grid-b)}
.grid i.goal{background:var(--goal-bg)}
.grid i.goal svg{width:72%;height:72%}
.grid .car{position:absolute;width:var(--c);height:var(--c);left:0;top:calc(var(--c)*5);display:flex;align-items:center;justify-content:center}
.grid .car svg{width:86%;height:86%;filter:drop-shadow(0 4px 3px var(--shadow))}
.strip{display:flex;align-items:center;gap:8px;background:var(--card);border:3px dashed var(--line);border-radius:28px;padding:22px 20px}
.blk{position:relative;flex:none;width:var(--bs);height:var(--bs);border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 0 var(--shadow)}
.blk svg{width:calc(var(--bs)*.72);height:calc(var(--bs)*.72)}
.blk .x{position:absolute;right:-6px;top:-10px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;font:700 22px 'Be Vietnam Pro';padding:0 10px;min-width:36px;text-align:center}
.move{background:var(--move)} .ctrl{background:var(--ctrl);color:var(--ctrl-ink)} .snd{background:var(--snd)} .end{background:var(--end)}
.blk.run{outline:8px solid var(--ink);outline-offset:4px;transform:translateY(-10px) scale(1.08);box-shadow:0 0 0 14px #fff,0 0 34px 18px var(--glow);z-index:2}
.arr{flex:none;width:22px;height:22px;opacity:.5}
.rep{display:flex;align-items:center;background:var(--ctrl-bg);border:4px solid var(--ctrl);border-radius:30px;padding:12px 10px 8px 10px;position:relative;flex:none}
.rep .lab{position:absolute;top:-18px;left:14px;background:var(--ctrl);color:var(--ctrl-ink);font:700 24px 'Be Vietnam Pro';border-radius:16px;padding:0 14px}
.pal{display:flex;gap:18px}
.grp{display:flex;gap:12px;padding:14px;border-radius:26px}
.grp.move{background:var(--move-bg)} .grp.ctrl{background:var(--ctrl-bg)} .grp.snd{background:var(--snd-bg)} .grp.end{background:var(--end-bg)}
.grp .blk{width:var(--ps);height:var(--ps)} .grp .blk svg{width:calc(var(--ps)*.72);height:calc(var(--ps)*.72)}
</style><body><svg width="0" height="0" style="position:absolute"><defs>

 <div style="flex:1;display:flex;flex-direction:column;min-width:0">

   <div class="blk ctrl" style="--bs:150px;"><svg><use href="#i-flag"/></svg></div><div class="blk move" style="--bs:150px;outline:8px solid var(--ink);outline-offset:4px;"><svg><use href="#i-fwd"/></svg></div><div class="blk move" style="--bs:150px;"><svg><use href="#i-back"/></svg></div><div class="blk move" style="--bs:150px;"><svg><use href="#i-left"/></svg></div><div class="blk move" style="--bs:150px;"><svg><use href="#i-right"/></svg></div><div class="blk end" style="--bs:150px;"><svg><use href="#i-end"/></svg></div>
