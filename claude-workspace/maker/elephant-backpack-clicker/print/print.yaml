# elephant-backpack-clicker - ban in, doc boi tools/print/scripts/slice.py
# Balo giu nguyen huong in cua tac gia, chi doi chu tren tam nhan.
# stl/ = ban giam luoi 150k tam giac (sai lech <= 0,018 mm so voi stl-full/) de Bambu Studio khong ngon RAM.
data_dir: .
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates
common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  p1-stlab:
    process: 0.20mm Standard @BBL A1
    stl: ["backpack-stlab.stl", "elephant.stl"]
  p2-small-tree:
    process: 0.20mm Standard @BBL A1
    stl: ["backpack-small-tree.stl", "elephant.stl"]
