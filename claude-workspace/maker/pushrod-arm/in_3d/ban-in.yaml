# pushrod_arm (2026-10-23) - cau hinh cho maker/robotics-cad/scripts/chuan-bi-in.py
# (kiem-tra.py -> xuat-stl.py -> cat-lop.py). Chuyen tu _work/test_export_v4.py + slice_v4.py (phien Desktop).
# Du lieu (FCStd, STL, ket qua cat lop) o ngoai repo; duong dan duoi day tuong doi theo thu muc nay
thu_muc_du_lieu: D:/06_FreeCAD/pushrod_arm/in_3d
fcstd: ../pushrod_arm.FCStd
tu_the_goc: ../pushrod_arm_rest.json   # file luu luc dang mo phong van xuat dung tu the goc
may: Bambu Lab A1 0.4 nozzle
stl: STL
ra: PLATES_cat-lop        # thu muc moi, khong de ket qua cu cua slice_v4.py

# Tang 1 (kiem-tra.py che-do=nhanh) - tham so khoa=gia-tri
kiem_tra:
  - out=../_work/kiem-tra
  - linh-kien=CB_*,M2_5x*,Socket_2x8
  - bo-cap=Servo_horn|CB_Servo9g_180_gripper
  - bo-cap=Pinion_m1_z10_turntable|CB_Servo9g_360_turntable
  - bo-cap=M2_5x*|*
  - bo-cap=Pin_*|Pin_*
  - an-khop=Turntable_gear_m1_z60|Pinion_m1_z10_turntable
  - an-khop=Pinion_WormWheel_*|Worm_*
  - an-khop=Pinion_WormWheel_*|Rack_*
  - an-khop=Jaw_1_driven_by_servo|Jaw_2_idler     # 2 ham kep an khop rang quanh 2 chot
  - an-khop=Washer_shaft_*|Housing_*              # washer chan doc truc ngoai vach, tu do 0.1 mm (khong phai lap ghep)
  - nhieu-solid=Spacer_D,Spacer_E

# Huong in tung chi tiet (chuyen tu bang S trong _work/test_export_v4.py)
xuat:
  luoi: {linear_mm: 0.03, angular_rad: 0.2618}
  quy_tac:
    - {ten: [Base_housing, Base_foot, Base_deck, Slide_ring], nhom: 01_Base}
    - {ten: [Turntable_gear_m1_z60, Turntable, Pinion_m1_z10_turntable], nhom: 01_Base, xoay: {x: 180}}
    - {ten: [Turret_one_piece], nhom: 02_Turret}
    - {ten: [Spacer_S, Spacer_S001, Spacer_A, Spacer_A001], nhom: 02_Turret, xoay: {x: 90}}
    - {ten: [Boom001], nhom: 03_Boom, xoay: {x: 90}}
    - {ten: [Spacer_D, Spacer_E], nhom: 04_Forearm, xoay: {x: 90}, tach_solid: true}
    - {ten: [Forearm_plate_L, Forearm_plate_R, Wrist_spacer], nhom: 04_Forearm, xoay: {x: 90}}
    - {ten: [Housing_Shoulder, Rack_Shoulder, Washer_shaft_Shoulder], nhom: 05_PushRod_Shoulder, xoay: {x: 90}, khung: Rack_Shoulder}
    - {ten: [Pinion_WormWheel_Shoulder], nhom: 05_PushRod_Shoulder, xoay: {x: -90}, khung: Rack_Shoulder}
    - {ten: [Worm_Shoulder], nhom: 05_PushRod_Shoulder, xoay: {y: -90}, khung: Rack_Shoulder}
    - {ten: [Housing_Elbow, Rack_Elbow, Washer_shaft_Elbow], nhom: 05_PushRod_Elbow, xoay: {x: 90}, khung: Rack_Elbow}
    - {ten: [Pinion_WormWheel_Elbow], nhom: 05_PushRod_Elbow, xoay: {x: -90}, khung: Rack_Elbow}
    - {ten: [Worm_Elbow], nhom: 05_PushRod_Elbow, xoay: {y: -90}, khung: Rack_Elbow}
    # khung kep: tu the goc cua kep (E0 + 130 mm theo -30 do, nghieng 30 do quanh Y) - nhu PG trong test_export_v4.py
    - {ten: [Jaw_1_driven_by_servo], nhom: 06_Gripper, xoay: {x: -90}, khung: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {ten: [Jaw_1_driven_by_servo_TPU_pad, Jaw_2_idler_TPU_pad], nhom: 06_Gripper, xoay: {x: 90}, hau_to: _TPU,
       khung: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {ten: [Jaw_2_idler, Gripper_frame, Gripper_top_plate, Pin_jaw2, Spacer_jaw2, Washer_pin], nhom: 06_Gripper, xoay: {x: 90},
       khung: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {ten: [Pin_S, Pin_A, Pin_B, Pin_C, Pin_D, Pin_E], nhom: 07_Pins}
    - {ten: [Pin_S_washer, Pin_A_washer, Pin_B_washer, Pin_C_washer, Pin_D_washer, Pin_E_washer], nhom: 07_Pins, xoay: {x: 90}}

chung: {only_one_wall_top: "1", infill_combination: "1", sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}

ban:
  P1_De__0.24Draft_PLA:
    process: 0.24mm Draft @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "12%", top_shell_layers: "4", bottom_shell_layers: "3"}
    stl: ["*__Base_housing.stl", "*__Base_deck.stl", "*__Base_foot.stl"]
  P2_Turret_Mam__0.20_PLA:
    process: 0.20mm Standard @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Turret_one_piece.stl", "*__Turntable.stl", "*__Slide_ring.stl", "*__Spacer_S*.stl", "*__Spacer_A*.stl",
          "*__Wrist_spacer.stl", "*__Spacer_D_*.stl", "*__Spacer_E_*.stl", "*__Washer_shaft_*.stl", "*__Turntable_gear_m1_z60.stl"]
  P3_Forearm_VoXilanh__0.20_PLA:
    process: 0.20mm Standard @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Forearm_plate_*.stl", "*__Gripper_top_plate.stl", "*__Housing_Shoulder.stl", "*__Housing_Elbow.stl"]
  P4_Boom_KhungKep__0.20_PLA_support:
    process: 0.20mm Standard @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "20%", enable_support: "1", support_type: tree(auto),
          support_threshold_angle: "40", support_on_build_plate_only: "0"}
    stl: ["*__Boom001.stl", "*__Gripper_frame.stl"]
  P5_BanhRang_ThanhRang_Chot__0.16_PLA:
    process: 0.16mm Optimal @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "4", sparse_infill_density: "40%", wall_generator: arachne, top_shell_layers: "6",
          bottom_shell_layers: "5", brim_type: auto_brim, infill_combination: "0"}
    stl: ["*__Rack_*.stl", "*__Jaw_1_driven_by_servo*.stl", "*__Jaw_2_idler*.stl", "*__Pinion*.stl", "*__Pin_*.stl",
          "*__Spacer_jaw2.stl", "*__Washer_pin.stl"]
    bo: ["*_TPU.stl"]
  P7_TrucVit__0.12_PLA_100pct:
    process: 0.12mm Fine @BBL A1
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "4", sparse_infill_density: "100%", sparse_infill_pattern: zig-zag, infill_combination: "0",
          wall_generator: arachne, brim_type: outer_only, brim_width: "4", only_one_wall_top: "0"}
    stl: ["*__Worm_*.stl"]
  P6_Dem_kep__TPU95A:
    process: 0.20mm Standard @BBL A1
    filament: Bambu TPU 95A @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "100%", sparse_infill_pattern: zig-zag, infill_combination: "0",
          only_one_wall_top: "0"}
    stl: ["*_TPU.stl"]
