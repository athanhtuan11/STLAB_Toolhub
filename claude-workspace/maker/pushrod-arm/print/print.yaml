# pushrod-arm - THONG TIN BAN IN (doc boi maker/robotics-cad/scripts/prepare-print.py)
# = check.py (tang 1) // export-stl.py -> slice.py (tang 2). Duong dan tuong doi theo thu muc nay (print/).
fcstd: ../freecad/pushrod_arm.FCStd
rest_pose: ../freecad/pushrod_arm_rest.json   # file Luu luc dang mo phong van xuat dung tu the goc
machine: Bambu Lab A1 0.4 nozzle               # profile may trong Bambu Studio
# Nhua MAC DINH (ban nao khong khai filament): PETG KINGROON - preset rieng cua Tuan trong Bambu Studio
# (da hieu chinh: flow 0.95, PA 0.02, 8 mm3/s, 240/250 C, ban textured 70 C). Doi sang PETG khac: doi ten preset.
filament: KINGROON-PETG PETG Basic @Bambu Lab A1 0.4 nozzle
stl: stl                                       # file sinh (khong len git)
plates_dir: plates                             # file sinh: <plate>/<plate>.3mf de in + print-overview.png

# Tang 1 - tham so check.py (key=value)
check:
  - out=../freecad/check
  - components=CB_*,M2_5x*,Socket_2x8
  - ignore-pair=Servo_horn|CB_Servo9g_180_gripper
  - ignore-pair=Pinion_m1_z10_turntable|CB_Servo9g_360_turntable
  - ignore-pair=M2_5x*|*
  - ignore-pair=Pin_*|Pin_*
  - mesh-pair=Turntable_gear_m1_z60|Pinion_m1_z10_turntable
  - mesh-pair=Pinion_WormWheel_*|Worm_*
  - mesh-pair=Pinion_WormWheel_*|Rack_*
  - mesh-pair=Jaw_1_driven_by_servo|Jaw_2_idler     # 2 ham kep an khop rang quanh 2 chot
  - mesh-pair=Washer_shaft_*|Housing_*              # washer chan doc truc ngoai vach, tu do 0.1 mm (khong phai lap ghep)
  - multi-solid=Spacer_D,Spacer_E

# Huong in tung chi tiet (khop quy tac DAU TIEN; names = Label, glob)
export:
  mesh: {linear_mm: 0.03, angular_rad: 0.2618}
  rules:
    - {names: [Base_housing, Base_foot, Base_deck, Slide_ring], group: 01_Base}
    - {names: [Turntable_gear_m1_z60, Turntable, Pinion_m1_z10_turntable], group: 01_Base, rotate: {x: 180}}
    - {names: [Turret_one_piece], group: 02_Turret}
    - {names: [Spacer_S, Spacer_S001, Spacer_A, Spacer_A001], group: 02_Turret, rotate: {x: 90}}
    - {names: [Boom001], group: 03_Boom, rotate: {x: 90}}
    - {names: [Spacer_D, Spacer_E], group: 04_Forearm, rotate: {x: 90}, split_solids: true}
    - {names: [Forearm_plate_L, Forearm_plate_R, Wrist_spacer], group: 04_Forearm, rotate: {x: 90}}
    - {names: [Housing_Shoulder, Rack_Shoulder, Washer_shaft_Shoulder], group: 05_PushRod_Shoulder, rotate: {x: 90}, frame: Rack_Shoulder}
    - {names: [Pinion_WormWheel_Shoulder], group: 05_PushRod_Shoulder, rotate: {x: -90}, frame: Rack_Shoulder}
    - {names: [Worm_Shoulder], group: 05_PushRod_Shoulder, rotate: {y: -90}, frame: Rack_Shoulder}
    - {names: [Housing_Elbow, Rack_Elbow, Washer_shaft_Elbow], group: 05_PushRod_Elbow, rotate: {x: 90}, frame: Rack_Elbow}
    - {names: [Pinion_WormWheel_Elbow], group: 05_PushRod_Elbow, rotate: {x: -90}, frame: Rack_Elbow}
    - {names: [Worm_Elbow], group: 05_PushRod_Elbow, rotate: {y: -90}, frame: Rack_Elbow}
    # khung kep: tu the goc cua kep (E0 + 130 mm theo -30 do, nghieng 30 do quanh Y)
    - {names: [Jaw_1_driven_by_servo], group: 06_Gripper, rotate: {x: -90}, frame: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {names: [Jaw_1_driven_by_servo_TPU_pad, Jaw_2_idler_TPU_pad], group: 06_Gripper, rotate: {x: 90}, suffix: _TPU,
       frame: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {names: [Jaw_2_idler, Gripper_frame, Gripper_top_plate, Pin_jaw2, Spacer_jaw2, Washer_pin], group: 06_Gripper, rotate: {x: 90},
       frame: [209.00144394797778, 0, 133.90666646784498, 0, 1, 0, 30]}
    - {names: [Pin_S, Pin_A, Pin_B, Pin_C, Pin_D, Pin_E], group: 07_Pins}
    - {names: [Pin_S_washer, Pin_A_washer, Pin_B_washer, Pin_C_washer, Pin_D_washer, Pin_E_washer], group: 07_Pins, rotate: {x: 90}}

common: {only_one_wall_top: "1", infill_combination: "1", sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}

# Ban in (profile chinh hang Bambu + ghi de). Lo lung -> slice.py tu xoay, van lo lung moi support (ban __orient/__support).
# 2026-10-23: chuyen PLA -> PETG; gop 2 Housing (tai chot can support) vao ban support P4 -> 7 ban thay vi 8.
plates:
  P1_Base__0.24Draft_PETG:
    process: 0.24mm Draft @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "12%", top_shell_layers: "4", bottom_shell_layers: "3"}
    stl: ["*__Base_housing.stl", "*__Base_deck.stl", "*__Base_foot.stl"]
  P2_Turret_Turntable__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Turret_one_piece.stl", "*__Turntable.stl", "*__Slide_ring.stl", "*__Spacer_S*.stl", "*__Spacer_A*.stl",
          "*__Wrist_spacer.stl", "*__Spacer_D_*.stl", "*__Spacer_E_*.stl", "*__Washer_shaft_*.stl", "*__Turntable_gear_m1_z60.stl"]
  P3_Forearm_Plates__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Forearm_plate_*.stl", "*__Gripper_top_plate.stl"]
  P4_Boom_Gripper_Housings__0.20_PETG_support:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%", enable_support: "1", support_type: tree(auto),
                support_threshold_angle: "40", support_on_build_plate_only: "0"}
    stl: ["*__Boom001.stl", "*__Gripper_frame.stl", "*__Housing_Shoulder.stl", "*__Housing_Elbow.stl"]
  P5_Gears_Racks_Pins__0.16_PETG:
    process: 0.16mm Optimal @BBL A1
    overrides: {wall_loops: "4", sparse_infill_density: "40%", wall_generator: arachne, top_shell_layers: "6",
                bottom_shell_layers: "5", brim_type: auto_brim, infill_combination: "0"}
    stl: ["*__Rack_*.stl", "*__Jaw_1_driven_by_servo*.stl", "*__Jaw_2_idler*.stl", "*__Pinion*.stl", "*__Pin_*.stl",
          "*__Spacer_jaw2.stl", "*__Washer_pin.stl"]
    exclude: ["*_TPU.stl"]
  P6_GripperPads__TPU95A:
    process: 0.20mm Standard @BBL A1
    filament: Bambu TPU 95A @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "100%", sparse_infill_pattern: zig-zag, infill_combination: "0",
                only_one_wall_top: "0"}
    stl: ["*_TPU.stl"]
  P7_Worms__0.12_PETG_100pct:
    process: 0.12mm Fine @BBL A1
    overrides: {wall_loops: "4", sparse_infill_density: "100%", sparse_infill_pattern: zig-zag, infill_combination: "0",
                wall_generator: arachne, brim_type: outer_only, brim_width: "4", only_one_wall_top: "0"}
    stl: ["*__Worm_*.stl"]
