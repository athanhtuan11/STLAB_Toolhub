# IN LAI 2026-10-24 (dong co 030 + hop so, bo thu co shield) - chi chi tiet doi so voi ban da in.
# Sinh tu print.yaml (cung profile P4/P5/P7). Chay: python ../../tools/robotics-cad/scripts/slice.py <file nay>
# Ngoai ra in theo file CyberBrick: 2 bo vo hop giam toc 1 truc (030).
partial: true   # chi 1 phan chi tiet -> slice.py khong bao STL chua xep ban
fcstd: ../freecad/pushrod_arm.FCStd
rest_pose: ../freecad/pushrod_arm_rest.json
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates-reprint-2026-10-24
check:
- out=../freecad/check
- components=CB_*,M2_5x*
- ignore-pair=Servo_horn|CB_Servo9g_180_gripper
- ignore-pair=Pinion_m1_z10_turntable|CB_Servo9g_360_turntable
- ignore-pair=M2_5x*|*
- ignore-pair=Pin_*|Pin_*
- mesh-pair=Turntable_gear_m1_z60|Pinion_m1_z10_turntable
- mesh-pair=Pinion_WormWheel_*|Worm_*
- mesh-pair=Pinion_WormWheel_*|Rack_*
- mesh-pair=Jaw_1_driven_by_servo|Jaw_2_idler
- mesh-pair=Washer_shaft_*|Housing_*
- multi-solid=Spacer_D,Spacer_E,Receiver_riser,Pin_gearbox_*
- ignore-pair=Pin_gearbox_*|CB_030_gearbox_*
export:
  mesh:
    linear_mm: 0.03
    angular_rad: 0.2618
  rules:
  - names:
    - Base_housing
    - Base_foot
    - Base_deck
    - Slide_ring
    group: 01_Base
  - names:
    - Receiver_riser
    group: 01_Base
    split_solids: true
  - names:
    - Turntable_gear_m1_z60
    - Turntable
    - Pinion_m1_z10_turntable
    group: 01_Base
    rotate:
      x: 180
  - names:
    - Turret_one_piece
    group: 02_Turret
  - names:
    - Spacer_S
    - Spacer_S001
    - Spacer_A
    - Spacer_A001
    group: 02_Turret
    rotate:
      x: 90
  - names:
    - Boom001
    group: 03_Boom
    rotate:
      x: 90
  - names:
    - Spacer_D
    - Spacer_E
    group: 04_Forearm
    rotate:
      x: 90
    split_solids: true
  - names:
    - Forearm_plate_L
    - Forearm_plate_R
    - Wrist_spacer
    group: 04_Forearm
    rotate:
      x: 90
  - names:
    - Housing_Shoulder
    group: 05_PushRod_Shoulder
    rotate:
      x: 90
    frame: Rack_Shoulder
  - names:
    - Rack_Shoulder
    - Washer_shaft_Shoulder
    group: 05_PushRod_Shoulder
    rotate:
      x: 90
    frame: Rack_Shoulder
  - names:
    - Pinion_WormWheel_Shoulder
    group: 05_PushRod_Shoulder
    rotate:
      x: -90
    frame: Rack_Shoulder
  - names:
    - Worm_Shoulder
    group: 05_PushRod_Shoulder
    rotate:
      y: -90
    frame: Rack_Shoulder
  - names:
    - Housing_Elbow
    group: 05_PushRod_Elbow
    rotate:
      x: 90
    frame: Rack_Elbow
  - names:
    - Rack_Elbow
    - Washer_shaft_Elbow
    group: 05_PushRod_Elbow
    rotate:
      x: 90
    frame: Rack_Elbow
  - names:
    - Pinion_WormWheel_Elbow
    group: 05_PushRod_Elbow
    rotate:
      x: -90
    frame: Rack_Elbow
  - names:
    - Worm_Elbow
    group: 05_PushRod_Elbow
    rotate:
      y: -90
    frame: Rack_Elbow
  - names:
    - Jaw_1_driven_by_servo
    group: 06_Gripper
    rotate:
      x: -90
    frame:
    - 209.00144394797778
    - 0
    - 133.90666646784499
    - 0
    - 1
    - 0
    - 30
  - names:
    - Jaw_1_driven_by_servo_TPU_pad
    - Jaw_2_idler_TPU_pad
    group: 06_Gripper
    rotate:
      x: 90
    suffix: _TPU
    frame:
    - 209.00144394797778
    - 0
    - 133.90666646784499
    - 0
    - 1
    - 0
    - 30
  - names:
    - Gripper_frame
    group: 06_Gripper
    rotate:
      x: 90
    frame:
    - 209.00144394797778
    - 0
    - 133.90666646784499
    - 0
    - 1
    - 0
    - 30
  - names:
    - Jaw_2_idler
    - Gripper_top_plate
    - Pin_jaw2
    - Spacer_jaw2
    - Washer_pin
    group: 06_Gripper
    rotate:
      x: 90
    frame:
    - 209.00144394797778
    - 0
    - 133.90666646784499
    - 0
    - 1
    - 0
    - 30
  - names:
    - Pin_S
    - Pin_A
    - Pin_B
    - Pin_C
    - Pin_D
    - Pin_E
    group: 07_Pins
  - names:
    - Pin_gearbox_Shoulder
    group: 07_Pins
    rotate:
      y: 90
    frame: Rack_Shoulder
    split_solids: true
  - names:
    - Pin_gearbox_Elbow
    group: 07_Pins
    rotate:
      y: 90
    frame: Rack_Elbow
    split_solids: true
  - names:
    - Pin_S_washer
    - Pin_A_washer
    - Pin_B_washer
    - Pin_C_washer
    - Pin_D_washer
    - Pin_E_washer
    group: 07_Pins
    rotate:
      x: 90
common:
  only_one_wall_top: '1'
  infill_combination: '1'
  sparse_infill_pattern: grid
  curr_bed_type: Textured PEI Plate
plates:
  R1_Housings__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides:
      wall_loops: '3'
      sparse_infill_density: 20%
    stl:
    - '*__Housing_Shoulder.stl'
    - '*__Housing_Elbow.stl'
  R2_Pins_Risers__0.16_PETG:
    process: 0.16mm Optimal @BBL A1
    overrides:
      wall_loops: '4'
      sparse_infill_density: 40%
      wall_generator: arachne
      top_shell_layers: '6'
      bottom_shell_layers: '5'
      brim_type: auto_brim
      infill_combination: '0'
    stl:
    - '*__Pin_gearbox_*.stl'
    - '*__Receiver_riser_*.stl'
  R3_Worms__0.12_PETG_100pct:
    process: 0.12mm Fine @BBL A1
    overrides:
      wall_loops: '4'
      sparse_infill_density: 100%
      sparse_infill_pattern: zig-zag
      infill_combination: '0'
      wall_generator: arachne
      brim_type: outer_only
      brim_width: '4'
      only_one_wall_top: '0'
    stl:
    - '*__Worm_*.stl'
