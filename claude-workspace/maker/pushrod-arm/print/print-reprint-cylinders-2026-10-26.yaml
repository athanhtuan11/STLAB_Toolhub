# IN LAI 2026-10-26: xi-lanh LAP DUOC (Tuan: Housing_Elbow + Piston_rod_Elbow in rieng khong lap vao nhau).
# Model: freecad/scripts/history/2026-10-26_cylinder_assemblable.py - long ong thang 6,6 x 8,6 ho mieng, piston got ve
# tiet dien ty 6 x 8, ranh dai oc ho mat tren (+y), lo O3,6 tron cho ty ren qua tuong truoc. Anh: images/review/12-*.png
# Thay R7 + R8 cua bo piston 2026-10-25 (da xoa 2026-10-26). R9 banh rang + Pin_gearbox chuyen tu bo do sang day (hinh hoc khong doi).
# Pin_gearbox: CHUA in lai - cho Tuan xem lo O4 tren hop so 030 that (test T9Assemble.test_gearbox_pins).
# Support: Tuan to trong Bambu Studio duoi TAI CHOT vo xi-lanh - GIU TRONG long ong (tran = cau 8,6 mm), khe banh rang,
# lo truc, ranh dai oc tren ty.
# Chay: python ../../tools/robotics-cad/scripts/slice.py <file nay>   (STL tu prepare-print print.yaml)
partial: true
fcstd: ../freecad/pushrod_arm.FCStd
rest_pose: ../freecad/pushrod_arm_rest.json
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates-reprint-cylinders-2026-10-26
common: {only_one_wall_top: "1", infill_combination: "1", sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  R10_Cylinder_Housings__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Housing_Shoulder.stl", "*__Housing_Elbow.stl"]
  R11_Piston_Rods__0.16_PETG:
    process: 0.16mm Optimal @BBL A1
    overrides: {wall_loops: "4", sparse_infill_density: "40%", wall_generator: arachne, brim_type: auto_brim,
                infill_combination: "0"}
    stl: ["*__Piston_rod_*.stl"]
  R9_Gears_Pins__0.12_PETG_100pct:            # tu bo piston 2026-10-25; Pin_gearbox: chua kiem voi hop so that
    process: 0.12mm Fine @BBL A1
    overrides: {wall_loops: "4", sparse_infill_density: "100%", sparse_infill_pattern: zig-zag, infill_combination: "0",
                wall_generator: arachne, brim_type: outer_only, brim_width: "4", only_one_wall_top: "0"}
    stl: ["*__Gear_z*.stl", "*__Pin_gearbox_*.stl"]
