# line-bot - THONG TIN BAN IN (doc boi tools/robotics-cad/scripts/prepare-print.py)
# Model SINH tu freecad/scripts/build_line_bot.py doc freecad/params.json -> doi linh kien = sua params.json roi chay lai.
fcstd: ../freecad/line_bot.FCStd
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates

# Thao lap: chua co object vit trong model (vit M3 tu ren vao lo moi, them sau khi chot linh kien).
assembly:
  allow: ["Ref_N20_*|Motor_mount_*", "Ref_N20_*|Ref_Wheel_*","Ref_Ball|Caster_mount", "Ref_Mega|Top_plate", "Ref_Battery|Base_plate"]

check:
  - out=../freecad/check
  - components=Ref_*                         # khoi tham chieu linh kien: chi kiem hinh hoc + va cham
  - ignore-pair=Ref_N20_*|Motor_mount_*      # motor luon trong hoc ga
  - ignore-pair=Ref_Ball|Caster_mount        # bi ep vao hoc cau
  - ignore-pair=Ref_N20_*|Ref_Wheel_*        # truc motor cam vao banh

# Huong in: chi tiet in = cac Label khong Ref_*
export:
  mesh: {linear_mm: 0.03, angular_rad: 0.2618}
  rules:
    - {names: [Base_plate, Top_plate], group: 01_Plates}                                       # cot huong len, in nguyen huong
    - {names: [Motor_mount_*, Caster_mount, Line_bracket], group: 02_Mounts, rotate: {x: 180}} # mat ap tam xuong ban
    - {names: [Sonar_bracket], group: 02_Mounts}                                               # de xuong ban, vach dung

common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}

plates:
  P1_Base__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["01_Plates__Base_plate*.stl"]
  P2_Top_Mounts__0.20_PETG:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "25%"}   # ga motor/bi chiu luc, vit tu ren can thanh day
    stl: ["01_Plates__Top_plate*.stl", "02_Mounts__*.stl"]
