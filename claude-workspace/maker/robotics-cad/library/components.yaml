# Danh mục linh kiện robotics STLab (đơn vị mm, g, V, A). Tên khóa không dấu, nội dung tiếng Việt.
# Quy tắc:
#   - model: đường dẫn trong community/freecad-library (CC-BY 3.0: ghi công tác giả khi dùng/chia sẻ).
#   - bbox_mm: ĐO TỪ MODEL bằng FreeCAD (hộp bao, gồm cả chân/cổng nhô ra), ngày 2026-10-21.
#   - thong_so: chỉ ghi khi có nguồn (nguon). Nguồn mâu thuẫn -> ghi cả hai. Chưa có -> todo.
#   - Hàng cùng mã có thể khác thông số: đo lại hàng thật trước khi chốt thiết kế.
#   - thu_vien: cyberbrick -> model/stl tinh tu library_roots.cyberbrick (tai bang library/cyberbrick.py,
#     nguon chinh thuc Bambu Lab, xem cyberbrick-sources.tsv). bbox_mm CyberBrick: do tu STEP bang FreeCAD
#     (optimalBoundingBox, 2026-10-21); STL cua hang bo bot dau cam nen co the nho hon toi 4 mm.
#   - thu_vien: boards -> STEP board chinh hang (Arduino giai nen bang library/boards.py) hoac DUNG TU BAN VE
#     (dung_tu_ban_ve: true, library/boards_param.py): mat bang dung ban ve, chieu cao linh kien la UOC -> do hang that.
#   - thu_vien: espressif -> STEP module ESP32 chinh hang (espressif/kicad-libraries 3.2.1, CC-BY-SA-4.0).
version: 1
cap_nhat: 2026-10-22
library_root: community/freecad-library
library_roots:
  cyberbrick: community/cyberbrick-official/models
  n20: community/n20-motor/models
  boards: community/boards-official/models
  espressif: community/espressif-kicad-libraries/3dmodels/espressif.3dshapes

