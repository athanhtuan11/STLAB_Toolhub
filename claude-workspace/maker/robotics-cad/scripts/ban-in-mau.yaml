# Mau ban-in.yaml cho cat-lop.py - chep vao thu muc in_3d/ cua du an roi sua.
# Duong dan tuong doi theo file nay. STL phai xuat SAN theo HUONG IN (cat-lop.py khong xoay: --orient 0).
may: Bambu Lab A1 0.4 nozzle          # ten profile may trong Bambu Studio (resources/profiles/BBL/machine)
stl: STL                              # thu muc STL
ra: PLATES_BambuA1_0.4                # thu muc ket qua

chung:                                # ghi de cho moi ban (khoa = khoa trong profile process)
  sparse_infill_pattern: grid

ban:
  P1_Than__0.20_PLA:
    process: 0.20mm Standard @BBL A1  # ten profile process chinh hang
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["*__Than_*.stl"]            # glob theo ten file
  P2_Dem__TPU:
    process: 0.20mm Standard @BBL A1
    filament: Bambu TPU 95A @BBL A1
    stl: ["*_TPU.stl"]
    bo: []                            # glob loai ra
