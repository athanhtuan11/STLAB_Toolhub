# <ten-du-an> - cau hinh cho maker/robotics-cad/scripts/chuan-bi-in.py (kiem-tra.py -> xuat-stl.py -> cat-lop.py)
# Mau day du: maker/pushrod-arm/in_3d/ban-in.yaml
# Du lieu nang (FCStd, STL, ket qua cat lop) o ngoai repo; cac duong dan duoi day tuong doi theo thu_muc_du_lieu.
thu_muc_du_lieu: D:/06_FreeCAD/<ten_du_an>/in_3d
fcstd: ../<ten_du_an>.FCStd
# tu_the_goc: ../<ten_du_an>_rest.json   # neu co macro mo phong: {Name: [[x,y,z],[q0,q1,q2,q3]]}
may: Bambu Lab A1 0.4 nozzle             # ten profile may trong Bambu Studio
stl: STL                                 # file sinh
ra: PLATES_cat-lop                       # file sinh

# Tang 1 - tham so kiem-tra.py (khoa=gia-tri). Quy uoc ten giup dung glob chung (xem robotics-cad/CLAUDE.md):
kiem_tra:
  - out=../_work/kiem-tra
  - linh-kien=CB_*,LK_*,M2_5x*,M3x*      # linh kien mua: chi kiem hinh hoc + va cham
  - bo-cap=M2_5x*|*                       # vit trong lo: cho phep cham
  # - an-khop=Gear_*|Pinion_*             # banh rang an khop: khe nho la dung
  # - nhieu-solid=Spacer_*                # object co y gom nhieu manh

# Huong in: moi chi tiet khop quy tac DAU TIEN (ten = Label, glob). Chi tiet khong khop -> khong xuat.
xuat:
  luoi: {linear_mm: 0.03, angular_rad: 0.2618}
  quy_tac:
    - {ten: [Than_*], nhom: 01_Than}                          # in nguyen huong trong file
    - {ten: [Nap_*], nhom: 01_Than, xoay: {x: 180}}          # lat up
    - {ten: ["*_TPU"], nhom: 09_Dem, xoay: {x: 90}, hau_to: _TPU}
    # khung: Label doi tuong hoac [x,y,z, truc x,y,z, goc] - dua ve he toa do khung truoc khi xoay
    # tach_solid: true - object nhieu manh -> moi manh 1 STL

chung: {sparse_infill_pattern: grid}     # ghi de cho moi ban

ban:
  P1_Than__0.20_PLA:
    process: 0.20mm Standard @BBL A1     # profile chinh hang
    filament: Bambu PLA Basic @BBL A1
    sua: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["01_Than__*.stl"]
  P2_Dem__TPU95A:
    process: 0.20mm Standard @BBL A1
    filament: Bambu TPU 95A @BBL A1
    stl: ["*_TPU.stl"]
