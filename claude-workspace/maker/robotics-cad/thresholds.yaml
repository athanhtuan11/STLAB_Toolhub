# Nguong kiem tra truoc khi in - doc boi scripts/check.py.
# Moi gia tri phai co nguon; chua co nguon thi de null -> script bao "chua co nguong" (khong tu doan).
# Nguon chi tiet: kiem-tra-model.md (muc ghi trong ngoac).

material: PETG             # PLA | PETG | PETG-HF - dung de uoc khoi luong (mac dinh PETG tu 2026-10-23)

density_g_cm3:             # TDS Bambu Lab, mau in 100% infill (4.4)
  PLA: 1.24
  PETG: 1.25
  PETG-HF: 1.28

min_wall_mm: 0.84          # 2 x duong in 0.42 mm, dau phun 0.4 mm mac dinh (0, skill bambu-a1)
overhang_deg: 45           # goc voi mat ban < 45 do thi can support (Bambu wiki, 5.1)
# Khe ho lap ghep 0.2 mm: Tuan chot 2026-10-23 ("de tam 0.2 mm la dep", da tinh co ngot nhua);
# trung khoi diem cong dong (forum Bambu / MakerWorld 0.1-0.2 mm moi ben).
# Profile chinh hang A1 (Bambu Studio 02.07, 0.20mm Standard) de xy_hole/contour_compensation = 0 -> khong bu lap ghep.
min_clearance_mm: 0.2
# Sai so luoi khi do khe: da giac noi tiep lam lo nho di ~0.006-0.026 mm (kiem-tra-model.md 2.3)
# -> khe thiet ke 0.20 do ra 0.19. Chi bao FAIL khi khe < min_clearance_mm - clearance_tolerance_mm.
clearance_tolerance_mm: 0.02
# Chong khoi nho hon gia tri nay = nhieu so cua luoi o mat trung nhau (da gap 0.03-0.04 mm3) -> coi la cham.
# TAM 0.1 mm3, Claude dat, khong co nguon.
min_overlap_mm3: 0.1

mesh:                      # sai lech lo O3 < 0.01 mm (2.3)
  linear_mm: 0.05
  angular_rad: 0.2618

wall_rays: 6000            # so tia toi da moi chi tiet (lay mau theo dien tich facet); tang cho chi tiet quan trong
wall_limit_mm: 5           # chi do thanh mong hon gia tri nay (thanh day hon khong can biet chinh xac)
# Vung mong nho hon gia tri nay = mep sac (vd. vat mep goc nhon, 0.02 mm) -> WARN thay vi FAIL.
# TAM 1 mm2: nguong loc bao cao do Claude dat, KHONG co nguon; chinh theo thuc te in.
thin_area_min_mm2: 1.0
sweep_step_deg: 5          # buoc goc mac dinh khi quet khop quay (3.2: buoc 10 do co the bo sot)
sweep_step_mm: 1           # buoc mac dinh khi quet khop truot
near_distance_mm: 5        # cap chi tiet cach nhau xa hon (theo hop bao) thi bo qua tinh khe

# Phan tich STL theo HUONG IN truoc khi cat lop (scripts/printability.py, goi tu slice.py) - them 2026-10-23 sau khi
# Tuan in pushrod-arm: phan nho ra khong support bi hong, chi tiet nho bong ban. overhang_deg dung chung o tren.
print:
  overhang_tol_deg: 2.0        # vat dung 45 do van in duoc -> chi bao khi < 43 do (luoi lam lech vai phan do)
  support_min_patch_mm2: 4.0   # TAM (Claude dat): vung nho ra nho hon -> bo qua
  bridge_max_mm: 5.0           # TAM: vung nho ra hep hon (vd. noc lo ngang) -> slicer bac cau duoc, khong can support
  min_patch_height_mm: 1.0     # vat nho sat ban (cao < 1 mm) -> bo qua
  brim_contact_max_mm2: 120.0  # TAM: dien tich chan cham ban nho hon -> bat brim (Tuan 2026-10-23: chi tiet nho can brim)
  brim_aspect_min: 2.5         # TAM: cao / be ngang nho nhat >= -> chi tiet cao manh -> brim
