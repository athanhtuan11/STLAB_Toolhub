# english-teacher (Cu Bong S3) - BAN IN THU khop lap truoc khi in ca bo (Tuan 2026-11-17). 1 mau, 1 ban, khong AMS.
# 2026-11-18 v2 theo gop y Tuan: bezel + eye-diffuser DAT (bo khoi ban); in lai speaker-ring (lo O47, bo lay), button-cap (ong nhun),
#   mic-clamp (PCB tron O15 Shopee, han day thang), amp-tray (ray ranh, vit M2.5 x 6) + mx-cross-gauge (khe 1,25 / 1,35 / 1,45).
# Thu: loa O52 vao vanh loa + vong ep (khe 0,3/ben), MAX98357A vao khay ampli, INMP441 vao kep mic,
#      switch MX vao nap nut dau, LED nhin qua tam tan sang. Vua het thi in plates-s3/ (print-s3.yaml).
# Ray do bo ESP32-S3 va ranh kep mic nam trong 2 nua vo (in rieng, ~5 h moi nua) - chua co mau cat thu.
# Cat lop: python tools/print/scripts/memjob.py 3 -- python tools/print/scripts/slice.py maker/english-teacher/print/print-s3-test.yaml
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl-s3
plates_dir: plates-s3-test
common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  p1-fit-test: {process: 0.20mm Standard @BBL A1, color: "#F6BE9A", overrides: {wall_loops: "3", sparse_infill_density: "20%"},
                stl: ["speaker-ring.stl", "amp-tray.stl", "mic-clamp.stl", "button-cap.stl", "mx-cross-gauge.stl"]}
