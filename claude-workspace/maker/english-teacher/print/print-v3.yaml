# english-teacher (Cu Bong) v3 LAP RAP THAT (cad/spec-owl-v3-assembly.md). STL sinh bang cad/build_owl_v3.py (Blender) -> cad/out-v3,
# chep sang print/stl-v3/. Cat lop: python ../../tools/print/scripts/memjob.py 3 -- python ../../tools/print/scripts/slice.py print/print-v3.yaml
# CHUA IN BO NAY truoc khi ban thu nho (print-v3-test.yaml) dat: lay snap + vit tu ren + vay vanh loa chua co so in that.
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl-v3
plates_dir: plates-v3
common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  # mau MO: nua truoc (mat rap xuong) + kep mic + de nut (mieng o len)
  A_shell_front: {process: 0.20mm Standard @BBL A1, overrides: {wall_loops: "3", sparse_infill_density: "15%"}, stl: ["shell-front.stl", "mic-clamp.stl", "button-base.stl"]}
  # mau MO: nua sau (mat rap xuong, 6 gieng vit)
  B_shell_back: {process: 0.20mm Standard @BBL A1, overrides: {wall_loops: "3", sparse_infill_density: "15%"}, stl: ["shell-back.stl"]}
  # mau MO: 2 vanh loa (mat luoi xuong, vay vit vat 45 do) + 2 vong ep + go roi am duong 2 cung (in phang, cao 4,0)
  C_speakers: {process: 0.20mm Standard @BBL A1, overrides: {wall_loops: "3", sparse_infill_density: "20%"}, stl: ["speaker-bezel-L.stl", "speaker-bezel-R.stl", "speaker-ring-L.stl", "speaker-ring-R.stl", "seam-spline.stl"]}
  # mau KEM: face-plate (mat truoc xuong) + bung + be (mat tren xuong) + khay S3/ampli
  D_cream: {process: 0.20mm Standard @BBL A1, overrides: {wall_loops: "3", sparse_infill_density: "20%", brim_type: outer_only, brim_width: "5"}, stl: ["face-plate.stl", "belly.stl", "base.stl", "s3-tray.stl"]}
  # mau BO: mo (lay xuong ban -> brim bat buoc) + nap nut dau
  E_butter: {process: 0.20mm Standard @BBL A1, overrides: {wall_loops: "3", sparse_infill_density: "20%", brim_type: outer_only, brim_width: "5"}, stl: ["beak.stl", "button-cap.stl"]}
