# frps tren VPS: may lab (frpc) noi ra day. Token doc tu bien moi truong FRP_AUTH_TOKEN (systemd EnvironmentFile).
bindPort = 7000
# cong chuyen tiep chi mo tren 127.0.0.1 -> chi Caddy dung duoc, internet khong vao thang
proxyBindAddr = "127.0.0.1"
allowPorts = [{ single = 18000 }, { single = 18003 }]
auth.method = "token"
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"
transport.tls.force = true
log.to = "/var/log/frps.log"
log.maxDays = 3
