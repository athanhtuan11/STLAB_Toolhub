# frpc tren may lab: noi ra VPS, dua cong 8003 (OTA) + 8000 (WebSocket) cua bridge len VPS.
# Bien moi truong nguoi dung (KHONG ghi vao file): FRP_SERVER_ADDR (IP VPS), FRP_AUTH_TOKEN.
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = 7000
auth.method = "token"
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"
transport.tls.enable = true
loginFailExit = false

[[proxies]]
name = "teacher-ota"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8003
remotePort = 18003

[[proxies]]
name = "teacher-ws"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8000
remotePort = 18000
