# nginx tren VPS (da co san, phuc vu mamnoncaynho.com) - them khoi rieng cho co giao. Chung chi: certbot --nginx -d <host>.
# 18003 (OTA) / 18000 (WebSocket) do frps mo tren 127.0.0.1, la duong ham ve may lab.
server {
    listen 80;
    listen [::]:80;
    server_name engteacher.mamnoncaynho.com;

    access_log /var/log/nginx/engteacher.access.log;
    error_log  /var/log/nginx/engteacher.error.log;

    location /xiaozhi/ota/ {
        proxy_pass http://127.0.0.1:18003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
