# Cau hinh STLab cho may chu xiaozhi (khong khoa). run.ps1 sinh runtime/data/.config.yaml tu file nay:
#   <IP> -> IP LAN, <PROMPT> -> noi dung prompt-teacher.md. api_key GeminiLLM duoc dien trong bo nho boi run.py tu bien GOOGLE_API_KEY.
server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://<IP>:8000/xiaozhi/v1/
  vision_explain: http://<IP>:8003/mcp/vision/explain

# Khong luu giong be: xoa file am thanh ngay sau khi dung
delete_audio: true
# Khong luu lich su: bo nho tat (nomem), khong dung mem0/powermem
selected_module:
  VAD: SileroVAD
  # Whisper chay TAI MAY (whisper-local, 127.0.0.1:8010) nghe ca tieng Viet + tieng Anh; giong be khong ra khoi may.
  ASR: LocalWhisperASR
  LLM: GeminiLLM
  VLLM: ChatGLMVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent

ASR:
  LocalWhisperASR:
    type: openai
    base_url: http://127.0.0.1:8010/v1/audio/transcriptions
    api_key: local
    model_name: whisper
    output_dir: tmp/
  # Du phong (khong nghe duoc tieng Viet): doi selected_module.ASR thanh FunASR
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    language: en

LLM:
  GeminiLLM:
    type: gemini
    api_key: set-by-run.py-from-env
    # gemini-3.1-flash-lite: ban on dinh, mien phi, ~1,1 s/cau (3.5-flash-lite 1,5 s; 3.5-flash 3,4 s; 2.5-* khong con cho tai khoan moi)
    model_name: "gemini-3.1-flash-lite"
    http_proxy: ""
    https_proxy: ""

TTS:
  EdgeTTS:
    type: edge
    # Giong da ngon ngu doc duoc ca tieng Viet va tieng Anh. rate -12% de noi cham cho be.
    voice: en-US-AvaMultilingualNeural
    rate: "-12"
    output_dir: tmp/
    # {{language}} trong khung prompt lay tu day; khong dat -> mac dinh "中文" -> Gemini tra loi tieng Trung (loi 2026-11-05)
    language: Vietnamese and simple English

# Tuoi 2-5, nho gon: bo tin nhan chao mac dinh tieng Trung
enable_greeting: true
enable_wakeup_words_response_cache: false

# Khung prompt rieng STLab (tieng Anh, khong tra vi tri IP/thoi tiet, khong noi dung chinh tri) thay agent-base-prompt.txt cua server
prompt_template: stlab-base-prompt.txt

prompt: |
  <PROMPT>

# --- Phien noi chuyen tu dong (2026-11-06, KEY4 cham 1 lan; may chu VAD tu chot cau) ---
# Be 2-5 tuoi hay ngap ngung: 600 ms im moi chot cau (goc 200 ms cat cau). Thay cham -> giam; bi cat cau -> tang.
VAD:
  SileroVAD:
    min_silence_duration_ms: 600
# Im 30 s thi co chao tam biet va ket thuc phien (bo ve nghi, do ton Gemini)
close_connection_no_voice_time: 30
end_prompt:
  enable: true
  prompt: |
    Hãy chào tạm biệt bé bằng đúng 1 câu thật ngắn, vui vẻ, gồm tiếng Việt và tiếng Anh, ví dụ: "Tạm biệt con nhé, bye bye!"
# So khop CHINH XAC sau khi bo dau cau + khoang trang, phan biet hoa thuong (intentHandler.check_direct_exit)
exit_commands:
  - "Tạmbiệtcô"
  - "tạmbiệtcô"
  - "Tạmbiệt"
  - "tạmbiệt"
  - "Thôinghỉ"
  - "thôinghỉ"
  - "Byebye"
  - "byebye"
  - "ByeBye"
  - "Goodbye"
  - "goodbye"
