# esp32-s3-cam (SolidCraft) - ban in, doc boi tools/robotics-cad/scripts/slice.py
data_dir: ..
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates
common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  p1-fit-test:
    process: 0.20mm Standard @BBL A1
    stl: ["coupon.stl", "coupon_ring.stl"]
  p2-enclosure:
    process: 0.20mm Standard @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "20%"}
    stl: ["body.stl", "bezel.stl", "base.stl", "u_frame.stl", "pin_cap.stl"]
