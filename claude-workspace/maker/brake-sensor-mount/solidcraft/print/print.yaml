# brake-sensor-mount - ban in, doc boi tools/print/scripts/slice.py
# p1: ga gan tay thang + ong dem L ; p2: de cong tac (in rieng de test)
data_dir: ..
machine: Bambu Lab A1 0.4 nozzle
filament: Bambu PETG Basic @BBL A1
stl: stl
plates_dir: plates
common: {sparse_infill_pattern: grid, curr_bed_type: Textured PEI Plate}
plates:
  p1-mount-v3:
    process: 0.16mm Optimal @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "30%"}
    stl: ["mount.stl", "spacer-L.stl"]
  p2-switch-base:
    process: 0.16mm Optimal @BBL A1
    overrides: {wall_loops: "3", sparse_infill_density: "30%"}
    stl: ["switch-base.stl"]
