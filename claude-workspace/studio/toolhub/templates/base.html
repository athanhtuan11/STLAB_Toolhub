<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · STLAB Toolhub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="{{ url_for('hub.tong_quan') }}">STLAB <span>Toolhub</span></a>
    <nav>
      {% for ep, label in nav %}<a href="{{ url_for(ep) }}" class="{{ 'on' if nav_on == ep else '' }}">{{ label }}</a>{% endfor %}
      <details class="more">
        <summary class="{{ 'on' if more_on else '' }}">{{ more_on or 'Thêm' }} ▾</summary>
        <div class="menu">{% for ep, label in nav_more %}<a href="{{ url_for(ep) }}">{{ label }}</a>{% endfor %}</div>
      </details>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="log" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
