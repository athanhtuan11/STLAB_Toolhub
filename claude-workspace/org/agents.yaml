# So nhan su agent STLab – MOT NGUON DUY NHAT (thiet ke: docs/reports/agent-org-roles-permissions.md muc 7).
# Chi Claude phien chinh (tang 0) sua file nay, Tuan duyet. Executor/agent KHONG duoc sua org/**.
# Kiem khop voi custom/agents/*.md va tools/delegate/delegate.py:  python tools/org/check_org.py
#
# tang: 0 giam doc | 1 quan ly | 2 nhan vien | tu-van
# loai: claude-session | claude-subagent | cli-executor | mcp-advisor
# chi_phi: claude-quota | free   (tra-phi = CAM: chi tra Claude Pro)
# muc_du_lieu (cao nhat duoc xem): public-tech < internal < customer   (xem org/policy.yaml)
# trang_thai: thu-viec | chinh-thuc | nghi

agents:
  - id: claude-main
    chuc_danh: Tổng giám đốc
    tang: 0
    bao_cao_cho: tuan
    loai: claude-session
    model: opus
    chi_phi: claude-quota
    ky_nang: [quyet-dinh, spec, gate, cad-hinh-hoc, an-toan, duyet]
    mang: web-search
    muc_du_lieu: customer
    nguoi_duyet: tuan
    gate: tuy-viec
    khi_het_han_muc: null
    trang_thai: chinh-thuc
    tu_ngay: 2026-10-26

  - id: check-runner
    chuc_danh: Quản lý kiểm tra
    tang: 1
    bao_cao_cho: claude-main
    loai: claude-subagent
    model: haiku
    chi_phi: claude-quota
    ky_nang: [test, kiem-in, doc-log]
    tool: [Bash, Read, Grep, Glob]
    mang: none
    muc_du_lieu: internal
    nguoi_duyet: claude-main
    gate: khong
    khi_het_han_muc: claude-main
    trang_thai: chinh-thuc
    tu_ngay: 2026-10-26

  - id: doc-writer
    chuc_danh: Quản lý tài liệu
    tang: 1
    bao_cao_cho: claude-main
