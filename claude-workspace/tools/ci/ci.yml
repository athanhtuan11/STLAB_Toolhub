name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Sync studio venv
        working-directory: claude-workspace/studio
        run: uv sync

      - name: Install ruff into venv
        working-directory: claude-workspace/studio
        run: uv pip install ruff

      # pinout + wireviz: Toolhub cai tu ban clone cong dong da ghim (community/ khong len git)
      # -> clone dung sha trong pins.tsv roi cai vao venv
      - name: Install pinned community libs
        shell: bash
        working-directory: claude-workspace
        run: |
          for n in j0ono0-pinout wireviz; do
            url=$(awk -F'\t' -v n="$n" '$1==n{print $2}' community/pins.tsv)
            sha=$(awk -F'\t' -v n="$n" '$1==n{print $5}' community/pins.tsv)
            git clone -q "$url" "community/$n"
            git -C "community/$n" checkout -q "$sha"
            uv pip install --python studio/.venv/Scripts/python.exe "./community/$n"
          done

      - name: Run CI tests
        working-directory: claude-workspace
        run: studio/.venv/Scripts/python.exe tools/ci/run_ci.py
